<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Timing Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .table-container { max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-100 py-10 px-4">

    <div class="w-full max-w-4xl mx-auto space-y-8">
        <!-- Input Form Card -->
        <div class="w-full bg-white rounded-xl shadow-lg p-6 md:p-8">
            <div class="text-center mb-6">
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Activity Logger</h1>
                <p class="text-gray-500 mt-1">Log your sessions to a shared Google Sheet.</p>
            </div>
            <form id="loggerForm" class="space-y-6">
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                        <input type="text" id="name" list="nameSuggestions" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                        <datalist id="nameSuggestions"></datalist>
                    </div>
                    <div>
                        <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label for="numTimings" class="block text-sm font-medium text-gray-700 mb-1">Number of Timings</label>
                    <input type="number" id="numTimings" min="1" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 1, 2, 3...">
                </div>
                <div id="timingsContainer" class="space-y-6"></div>
                <div class="pt-2">
                    <button type="submit" id="submitButton" class="w-full bg-indigo-600 text-white font-semibold py-3 px-4 rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 flex items-center justify-center">
                        <span id="buttonText">Log Activity</span>
                        <svg id="buttonSpinner" class="animate-spin ml-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- Logged Data Table Card -->
        <div class="w-full bg-white rounded-xl shadow-lg p-6 md:p-8">
             <div class="md:flex justify-between items-center mb-4 space-y-4 md:space-y-0">
                <h2 class="text-xl md:text-2xl font-bold text-gray-800">Logged Activities</h2>
                <div class="flex items-center space-x-2 md:space-x-4">
                    <input type="text" id="filterNameInput" placeholder="Filter by name..." class="w-32 md:w-48 px-3 py-1.5 border border-gray-300 rounded-md shadow-sm text-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <select id="sortSelect" class="px-3 py-1.5 border border-gray-300 rounded-md shadow-sm text-sm focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="date-desc">Sort by Date (Latest)</option>
                        <option value="date">Sort by Date (Oldest)</option>
                        <option value="name">Sort by Name (A-Z)</option>
                    </select>
                    <button id="refreshButton" title="Refresh Data" class="p-2 text-gray-500 hover:text-indigo-600 transition duration-150">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 110 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
             </div>
             <!-- Color Legend -->
             <div id="nameLegend" class="flex items-center space-x-4 text-xs text-gray-600 mb-4 h-5"></div>
             
             <div class="table-container border border-gray-200 rounded-lg">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timings</th>
                        </tr>
                    </thead>
                    <tbody id="activitiesTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Table rows will be inserted here -->
                    </tbody>
                </table>
             </div>
        </div>
        
        <div id="messagePopup" class="hidden fixed top-5 right-5 text-white py-2 px-4 rounded-lg shadow-xl"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const nameInput = document.getElementById('name');
            const dateInput = document.getElementById('date');
            const numTimingsInput = document.getElementById('numTimings');
            const timingsContainer = document.getElementById('timingsContainer');
            const loggerForm = document.getElementById('loggerForm');
            const messagePopup = document.getElementById('messagePopup');
            const submitButton = document.getElementById('submitButton');
            const buttonText = document.getElementById('buttonText');
            const buttonSpinner = document.getElementById('buttonSpinner');
            const activitiesTableBody = document.getElementById('activitiesTableBody');
            const refreshButton = document.getElementById('refreshButton');
            const nameSuggestions = document.getElementById('nameSuggestions');
            const filterNameInput = document.getElementById('filterNameInput');
            const sortSelect = document.getElementById('sortSelect');
            const nameLegend = document.getElementById('nameLegend');
            
            // !!! IMPORTANT !!! PASTE YOUR WEB APP URL HERE
            const SCRIPT_URL =  'PASTE_YOUR_NEW_DEPLOYED_WEB_APP_URL_HERE';
            const STORAGE_KEY = 'activityLoggerNames';
            
            let allActivities = [];
            let nameFrequencies = {}; 
            let minNameCount = 1, maxNameCount = 1;

            const loadNames = () => {
                const names = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                nameSuggestions.innerHTML = names.map(name => `<option value="${name}"></option>`).join('');
            };

            const saveName = (newName) => {
                if (!newName) return;
                let names = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                if (!names.includes(newName)) {
                    names.push(newName);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
                }
            };
            
            dateInput.value = new Date().toISOString().split('T')[0];

            const createTimingEntry = (index) => {
                 return `
                    <div class="p-4 border border-gray-200 rounded-lg bg-gray-50/50">
                        <p class="font-semibold text-gray-700 mb-3">Timing #${index}</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">Distance</label>
                                <select id="distance-select-${index}" class="distance-select w-full px-3 py-2 border border-gray-300 rounded-md" data-index="${index}">
                                    <option value="100">100 meters</option><option value="500">500 meters</option><option value="1000">1000 meters</option><option value="2000">2000 meters</option><option value="custom">Custom</option>
                                </select>
                                <input type="number" id="custom-distance-${index}" class="custom-distance-input hidden w-full mt-2 px-3 py-2 border border-gray-300 rounded-md" placeholder="Custom distance (m)">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">Time Taken (HH:MM:SS)</label>
                                <div class="flex items-center space-x-2">
                                    <input type="number" id="hours-${index}" min="0" class="w-full text-center px-2 py-2 border border-gray-300 rounded-md" placeholder="HH">
                                    <input type="number" id="minutes-${index}" min="0" max="59" class="w-full text-center px-2 py-2 border border-gray-300 rounded-md" placeholder="MM">
                                    <input type="number" id="seconds-${index}" min="0" max="59" class="w-full text-center px-2 py-2 border border-gray-300 rounded-md" placeholder="SS">
                                </div>
                            </div>
                        </div>
                    </div>`;
            };

            numTimingsInput.addEventListener('input', (e) => {
                const count = parseInt(e.target.value, 10);
                timingsContainer.innerHTML = '';
                if (count > 0 && count < 20) {
                    for (let i = 1; i <= count; i++) {
                        timingsContainer.innerHTML += createTimingEntry(i);
                    }
                }
            });

            timingsContainer.addEventListener('change', (e) => {
                if (e.target.classList.contains('distance-select')) {
                    const customInput = document.getElementById(`custom-distance-${e.target.dataset.index}`);
                    customInput.classList.toggle('hidden', e.target.value !== 'custom');
                }
            });
            
            const showMessage = (message, isError = false) => {
                messagePopup.textContent = message;
                messagePopup.className = `fixed top-5 right-5 text-white py-2 px-4 rounded-lg shadow-xl ${isError ? 'bg-red-500' : 'bg-green-500'}`;
                messagePopup.classList.remove('hidden');
                setTimeout(() => messagePopup.classList.add('hidden'), 4000);
            };

            const getColorForFrequency = (count) => {
                if (maxNameCount <= 1 || maxNameCount === minNameCount) {
                    return '#1f2937'; // Dark Gray for no variation
                }

                const normalized = (count - minNameCount) / (maxNameCount - minNameCount);
                
                // HSL Gradient: Dark Violet (270) -> Red (0)
                const hue = 270 - (normalized * 270); 
                const lightness = 35 + (normalized * 15);
                const saturation = 70 + (normalized * 20);

                return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
            };

            const renderLegend = () => {
                nameLegend.innerHTML = '';
                const counts = Object.values(nameFrequencies);
                if (counts.length < 1) return;

                if (minNameCount === maxNameCount) {
                    const color = getColorForFrequency(minNameCount);
                    nameLegend.innerHTML = `
                        <div class="flex items-center space-x-1.5">
                            <div class="w-3 h-3 rounded-full border border-gray-300" style="background-color: ${color};"></div>
                            <span>${minNameCount} Session${minNameCount > 1 ? 's' : ''}</span>
                        </div>`;
                    return;
                }

                const minColor = getColorForFrequency(minNameCount);
                const midColor = getColorForFrequency(minNameCount + (maxNameCount - minNameCount) / 2);
                const maxColor = getColorForFrequency(maxNameCount);

                nameLegend.innerHTML = `
                    <span class="font-medium">Frequency:</span>
                    <div class="flex items-center space-x-1.5">
                        <div class="w-3 h-3 rounded-full border border-gray-300" style="background-color: ${minColor};"></div>
                        <span>${minNameCount}</span>
                    </div>
                    <div class="flex-1 h-2 rounded-full mx-2" style="background: linear-gradient(to right, ${minColor}, ${midColor}, ${maxColor});"></div>
                    <div class="flex items-center space-x-1.5">
                        <div class="w-3 h-3 rounded-full border border-gray-300" style="background-color: ${maxColor};"></div>
                        <span>${maxNameCount} Sessions</span>
                    </div>`;
            };
            
            const renderTable = (dataToRender) => {
                 if (dataToRender.length === 0) {
                    activitiesTableBody.innerHTML = `<tr><td colspan="3" class="text-center p-4 text-gray-500">No matching activities found.</td></tr>`;
                    return;
                }
                
                activitiesTableBody.innerHTML = '';
                dataToRender.forEach(activity => {
                    const timingsHtml = activity.timings.map(t => `<div class="text-xs text-gray-600"><span class="font-medium">${t.distance}:</span> ${t.time}</div>`).join('');
                    const nameCount = nameFrequencies[activity.name] || 0;
                    const nameColor = getColorForFrequency(nameCount);
                    const row = `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium" style="color: ${nameColor};">${activity.name}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(activity.date).toLocaleDateString()}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 space-y-1">${timingsHtml}</td>
                        </tr>`;
                    activitiesTableBody.innerHTML += row;
                });
            };
            
            const applyFiltersAndSort = () => {
                let data = [...allActivities];
                const filterValue = filterNameInput.value.toLowerCase();
                const sortValue = sortSelect.value;
                
                if (filterValue) {
                    data = data.filter(activity => activity.name.toLowerCase().includes(filterValue));
                }
                
                if (sortValue === 'name') {
                    data.sort((a, b) => a.name.localeCompare(b.name));
                } else if (sortValue === 'date-desc') {
                    data.sort((a, b) => new Date(b.date) - new Date(a.date));
                } else { // Default to 'date' (oldest)
                    data.sort((a, b) => new Date(a.date) - new Date(b.date));
                }
                
                renderTable(data);
            };

            const fetchAndDisplayData = async () => {
                if (SCRIPT_URL.includes('PASTE_YOUR')) {
                    activitiesTableBody.innerHTML = `<tr><td colspan="3" class="text-center p-4 text-red-500">Error: SCRIPT_URL is not set.</td></tr>`;
                    return;
                }
                activitiesTableBody.innerHTML = `<tr><td colspan="3" class="text-center p-4 text-gray-500">Loading activities...</td></tr>`;
                
                try {
                    const response = await fetch(SCRIPT_URL);
                    const result = await response.json();
                    if (result.result !== 'success') throw new Error(result.message);
                    
                    const grouped = result.data.reduce((acc, row) => {
                        const key = `${row.name}-${row.date}`;
                        if (!acc[key]) {
                            acc[key] = { name: row.name, date: row.date, timings: [] };
                        }
                        acc[key].timings.push({ distance: row.distance, time: row.time });
                        return acc;
                    }, {});

                    allActivities = Object.values(grouped);

                    // --- SMART NAME GROUPING AND FREQUENCY COUNT ---
                    const uniqueNames = [...new Set(allActivities.map(a => a.name))];
                    const nameMap = {};

                    // Create a map from each name variation to its longest (canonical) form.
                    uniqueNames.forEach(name => {
                        let canonicalName = name;
                        uniqueNames.forEach(otherName => {
                            if (otherName.startsWith(name) && otherName.length > canonicalName.length) {
                                canonicalName = otherName;
                            }
                        });
                        nameMap[name] = canonicalName;
                    });
                    
                    // Second pass to resolve chained mappings (e.g., A -> B, B -> C => A -> C)
                    Object.keys(nameMap).forEach(key => {
                        let mapped = nameMap[key];
                        while (mapped !== nameMap[mapped]) {
                            mapped = nameMap[mapped];
                        }
                        nameMap[key] = mapped;
                    });

                    // Apply the canonical name to each activity
                    allActivities.forEach(activity => {
                        activity.name = nameMap[activity.name];
                    });
                    
                    // Now, calculate frequencies based on the canonical names
                    nameFrequencies = allActivities.reduce((acc, activity) => {
                        acc[activity.name] = (acc[activity.name] || 0) + 1;
                        return acc;
                    }, {});
                    // --- END OF NAME GROUPING ---

                    const counts = Object.values(nameFrequencies);
                    minNameCount = counts.length > 0 ? Math.min(...counts) : 1;
                    maxNameCount = counts.length > 0 ? Math.max(...counts) : 1;
                    
                    renderLegend();
                    applyFiltersAndSort();

                } catch (error) {
                    activitiesTableBody.innerHTML = `<tr><td colspan="3" class="text-center p-4 text-red-500">Failed to load data: ${error.message}</td></tr>`;
                }
            };

            loggerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                saveName(nameInput.value);
                const numTimings = parseInt(numTimingsInput.value, 10) || 0;
                let timingsArray = [];
                for (let i = 1; i <= numTimings; i++) {
                    const distanceSelect = document.getElementById(`distance-select-${i}`).value;
                    const customDistance = document.getElementById(`custom-distance-${i}`).value;
                    const distance = distanceSelect === 'custom' ? customDistance : distanceSelect;
                    
                    const h = document.getElementById(`hours-${i}`).value;
                    const m = document.getElementById(`minutes-${i}`).value;
                    const s = document.getElementById(`seconds-${i}`).value;
                    const paddedMinutes = (m || '0').padStart(2, '0');
                    const paddedSeconds = (s || '0').padStart(2, '0');
                    let timeString;
                    if (h) {
                        timeString = `${h}:${paddedMinutes}:${paddedSeconds}`;
                    } else if (m) {
                        timeString = `${m.padStart(2,'0')}:${paddedSeconds}`;
                    } else {
                        timeString = `0:${paddedSeconds}`;
                    }
                    const formattedTimeForSheet = `'${timeString}`;

                    timingsArray.push({
                        distance: `${distance}m`,
                        time: formattedTimeForSheet
                    });
                }
                
                submitButton.disabled = true;
                buttonText.textContent = 'Submitting...';
                buttonSpinner.classList.remove('hidden');

                try {
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ name: nameInput.value, date: dateInput.value, timings: timingsArray }) });
                    const result = await response.json();
                    if (result.result !== 'success') throw new Error(result.message);
                    showMessage('Activity logged successfully!');
                    loggerForm.reset();
                    timingsContainer.innerHTML = '';
                    dateInput.value = newtoISOString().split('T')[0];
                    loadNames();
                    fetchAndDisplayData();
                } catch (error) {
                    showMessage(`Error: ${error.message}`, true);
                } finally {
                    submitButton.disabled = false;
                    buttonText.textContent = 'Log Activity';
                    buttonSpinner.classList.add('hidden');
                }
            });

            refreshButton.addEventListener('click', fetchAndDisplayData);
            filterNameInput.addEventListener('input', applyFiltersAndSort);
            sortSelect.addEventListener('change', applyFiltersAndSort);

            loadNames();
            fetchAndDisplayData();
        });
    </script>
</body>
</html>
